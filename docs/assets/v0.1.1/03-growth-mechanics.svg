<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="8" fill="#60a5fa"/>

  <text x="70" y="90" fill="#f9fafb" font-size="52" font-family="Inter, Segoe UI, Arial" font-weight="700">Card 3 · Growth Mechanics</text>
  <text x="70" y="136" fill="#93c5fd" font-size="27" font-family="Inter, Segoe UI, Arial" font-weight="500">capacity / delta / gate + pending</text>

  <rect x="80" y="190" width="690" height="330" rx="22" fill="url(#card)" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="190" width="690" height="330" rx="22" fill="url(#card)" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>

  <line x1="770" y1="355" x2="825" y2="355" stroke="#60a5fa" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="80" y="560" width="1440" height="250" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <text x="118" y="265" fill="#f8fafc" font-size="34" font-family="Inter, Segoe UI, Arial" font-weight="600"><tspan x="118" dy="0">Evidence accumulates</tspan><tspan x="118" dy="44">in pending state</tspan></text>
  <text x="868" y="265" fill="#f8fafc" font-size="34" font-family="Inter, Segoe UI, Arial" font-weight="600"><tspan x="868" dy="0">Commit occurs after</tspan><tspan x="868" dy="44">gate threshold crossing</tspan></text>
  <text x="118" y="640" fill="#dbeafe" font-size="31" font-family="Inter, Segoe UI, Arial" font-weight="500"><tspan x="118" dy="0">Repeated small signals become stable shifts.</tspan><tspan x="118" dy="42">Progressive adaptation with fewer random spikes.</tspan></text>
</svg>